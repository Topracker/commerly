name: App Android (AAB assinado)

# Gera o .aab do app nativo da Commerly (Capacitor, pasta mobile/) pronto para
# subir no Play Console. Roda manualmente (aba Actions → "App Android" → Run
# workflow) ou a cada push na main que mexa em mobile/ ou neste arquivo.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   conteúdo de .android-keys/commerly-upload.jks.base64
#   ANDROID_KEYSTORE_PASSWORD senha da chave (ver .android-keys/LEIA-ME-CHAVE.txt)
#   ANDROID_KEY_ALIAS         commerly-upload

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'versionName (ex.: 1.0.0). Em branco = 1.0.<número do build>'
        required: false
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK (já vem no runner)
        run: echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" && test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: ImageMagick (ícones e splash)
        run: command -v magick || command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)

      - name: Dependências do Capacitor
        run: npm install --no-audit --no-fund

      - name: Gerar projeto Android
        run: npx cap add android

      - name: Ajustes Commerly (permissões, App Link, ícones, versão)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.versao || format('1.0.{0}', github.run_number) }}
        run: node scripts/patch-android.mjs

      - name: Sincronizar plugins
        run: npx cap sync android

      - name: Compilar AAB de release
        working-directory: mobile/android
        run: ./gradlew --no-daemon bundleRelease

      - name: Assinar com a chave de upload
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p ../saida
          if [ -z "$KS_B64" ]; then
            # Sem os secrets: entrega o AAB SEM assinatura, para assinar na máquina
            # local com a chave de .android-keys/ (ver mobile/README.md).
            echo "::warning::Secrets da chave não configurados — AAB sai sem assinatura."
            cp "$AAB" "../saida/commerly-${{ github.run_number }}-SEM-ASSINATURA.aab"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" \
            "$AAB" "$KS_ALIAS"
          jarsigner -verify "$AAB"
          cp "$AAB" "../saida/commerly-${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: commerly-android-${{ github.run_number }}
          path: saida/*.aab
          if-no-files-found: error

      # Também publica como pré-release (download sem login no GitHub).
      - name: Publicar AAB como pré-release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-build-${{ github.run_number }}" saida/*.aab \
            --prerelease --target "${{ github.sha }}" \
            --title "App Android — build ${{ github.run_number }}" \
            --notes "AAB gerado pelo workflow android.yml (commit ${{ github.sha }})."

      # Guarda o último AAB no branch android-builds: chega no PC com um simples
      # git fetch (Git GUI → Remote → Fetch), sem baixar nada pelo navegador.
      - name: Guardar AAB no branch android-builds
        working-directory: .
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/aab" && cp saida/*.aab "$RUNNER_TEMP/aab/commerly-ultimo.aab"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin android-builds 2>/dev/null; then
            git switch -c android-builds FETCH_HEAD
          else
            git switch --orphan android-builds
          fi
          cp "$RUNNER_TEMP/aab/commerly-ultimo.aab" commerly-ultimo.aab
          echo "build ${{ github.run_number }} — commit ${{ github.sha }}" > LEIA-ME.txt
          git add -f commerly-ultimo.aab LEIA-ME.txt
          git commit -m "AAB do build ${{ github.run_number }}"
          git push origin android-builds
