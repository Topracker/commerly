name: Sincronizar pagamentos Mercado Pago

# No plano Hobby da Vercel o Cron roda no máximo 1x/dia, então a cadência de
# 5 minutos é feita aqui pelo GitHub Actions, que chama o mesmo endpoint
# protegido por CRON_SECRET. (O cron diário do vercel.json fica como backup.)
#
# Requer um secret do repositório chamado CRON_SECRET com o MESMO valor da
# env var CRON_SECRET na Vercel.

on:
  schedule:
    - cron: '*/5 * * * *' # a cada 5 minutos (o GitHub pode atrasar sob carga)
  workflow_dispatch: {} # permite disparar manualmente na aba Actions

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de sincronização
        run: |
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X GET "https://commerly.com.br/api/mercadopago/sincronizar-cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo ""
          test "$code" = "200"
