<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commerly — sem conexão</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f1a;color:#e5e7eb;font-family:system-ui,-apple-system,Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  img{width:88px;height:88px;border-radius:20px}
  h1{font-size:20px;margin:8px 0 0}
  p{margin:0;color:#9ca3af;max-width:320px;line-height:1.45}
  button{margin-top:8px;background:#00c896;color:#04231d;border:0;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Sem conexão com a internet</h1>
  <p>A Commerly precisa de internet para funcionar. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button onclick="location.href='https://commerly.com.br/entrar?source=app'">Tentar de novo</button>
</main>
</body>
</html>
